[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spindle"
dynamic = ["version"]
description = "Self-hosted automatic disc ripper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.52.4",
  "sqlmodel>=0.0.22",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "pyudev>=0.24; sys_platform == 'linux'",
  "structlog>=24.4",
  "typer>=0.13",
  "rapidfuzz>=3.10",
  "srt>=3.5.3",
  "charset-normalizer>=3.5.1",
  "argon2-cffi>=23.1",
]

[project.scripts]
spindle = "spindle.cli:main"

[tool.hatch.version]
path = "spindle/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["spindle"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spindle/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# typer's own API is `Option()`/`Argument()` calls as parameter defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
platform = "linux"  # the app only ever runs in the Linux container; dev machines vary
strict = true
exclude = ["^spindle/alembic/versions/"]

[[tool.mypy.overrides]]
module = "pyudev.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "discid.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "srt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "argon2.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
